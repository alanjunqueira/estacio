services:
  hadoop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadoop-lab
    hostname: hadoop-lab
    ports:
      - "9870:9870"
      - "9864:9864"
      - "8088:8088"
      - "9000:9000"
    volumes:
      - hadoop_data:/data
      - ./:/workspace
    environment:
      - CLUSTER_NAME=curso-hadoop-linux
    restart: unless-stopped

volumes:
  hadoop_data:
